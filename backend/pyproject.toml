[project]
name = "vapas"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "boto3>=1.35",
    "pyyaml>=6.0.2",
    "argon2-cffi>=23.1",
    "pyjwt>=2.10",
    "cryptography>=44",
    "email-validator>=2.2",
    "pdfplumber>=0.11",
    "pypdf>=5.1",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "httpx>=0.28",
    "scipy>=1.14",
    "rapidfuzz>=3.10",
    "fpdf2>=2.8",
    "sentry-sdk>=2.20",
    "dnspython>=2.7",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.118",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "boto3-stubs[s3]>=1.35",
    "types-openpyxl>=3.1",
    "xlwt>=1.3",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vapas"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S", "ERA", "PT", "N"]
ignore = ["S101", "S105"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S106", "S603", "S607", "S608"]
"src/vapas/synthetic/**" = ["S311", "E501"]
"scripts/**" = ["S311"]
"scripts/backup_restore_check.py" = ["S603"]
"src/vapas/letters/templates.py" = ["E501"]
"src/vapas/cases/reminders.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
files = ["src", "tests", "scripts", "migrations", "loadtest"]

[[tool.mypy.overrides]]
module = ["xlrd", "xlrd.*", "xlwt", "scipy", "scipy.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = ["integration: needs running postgres, redis and object storage"]
addopts = "-m 'not integration'"
