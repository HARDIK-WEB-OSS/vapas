name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - name: Validate rule YAML
        run: uv run --project backend --locked python rules/schema.py

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Python dependencies (pip-audit)
        working-directory: backend
        run: |
          uv export --locked --no-hashes --no-emit-project > /tmp/requirements.txt
          uvx pip-audit@2.9.0 -r /tmp/requirements.txt --no-deps --disable-pip
      - name: Frontend dependencies (npm audit)
        working-directory: frontend
        run: npm audit --audit-level=high

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - run: uv sync --locked
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy
      - name: Unit tests
        run: uv run pytest
      - name: Start the full stack
        working-directory: .
        run: cp .env.example .env && docker compose up -d --build --wait
      - name: Integration tests
        run: |
          docker compose stop worker
          uv run pytest -m integration
          docker compose start worker
      - name: API ready through compose
        run: curl --fail --silent --show-error http://127.0.0.1:8000/ready
      - name: Stack logs
        if: failure()
        working-directory: .
        run: docker compose logs --no-color

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Verify-email page under React Strict Mode (next dev)
        run: E2E_DEV=1 npx playwright test

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Start infra, roles, migrations and bucket
        run: |
          cp .env.example .env
          docker compose up -d --build --wait api
          docker compose stop api
      - name: Backend dependencies
        working-directory: backend
        run: uv sync --locked
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium
      - name: Full-stack Playwright flow
        working-directory: frontend
        env:
          E2E_FULL: "1"
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/test-results
          retention-days: 3
          if-no-files-found: ignore
      - name: Stack logs
        if: failure()
        run: docker compose logs --no-color
