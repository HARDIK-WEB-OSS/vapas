name: blocklist-refresh

on:
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: blocklist-refresh
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.9"
      - name: Compare the latest list with rules/email/disposable_domains.txt
        id: compare
        working-directory: backend
        run: |
          set +e
          uv run --locked python scripts/refresh_disposable_domains.py --check --summary "$RUNNER_TEMP/summary.md"
          code=$?
          set -e
          if [ "$code" -eq 3 ]; then
            echo "update=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -ne 0 ]; then
            echo "check failed with exit code $code"
            exit "$code"
          fi
      - name: Open or update the "Blocklist update available" issue
        if: steps.compare.outputs.update == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Blocklist update available
        run: |
          number=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number,title --jq "map(select(.title == \"$TITLE\")) | .[0].number // empty")
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file "$RUNNER_TEMP/summary.md"
            echo "updated issue #$number"
          else
            gh issue create --title "$TITLE" --body-file "$RUNNER_TEMP/summary.md"
          fi
