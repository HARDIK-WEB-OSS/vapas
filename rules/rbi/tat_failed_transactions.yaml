instrument:
  id: rbi.dpss_629_2019
  issuer: RBI
  title: Harmonisation of Turn Around Time (TAT) and customer compensation for failed transactions using authorised Payment Systems
  ref_no: RBI/2019-20/67
  dept_ref: DPSS.CO.PD No.629/02.01.014/2019-20
  issued_on: 2019-09-20
  effective_from: 2019-10-15
  effective_to: null
  legal_status: in_force_unconfirmed
  page:
    url: https://www.rbi.org.in/Scripts/NotificationUser.aspx?Id=11693&Mode=0
    fetched_on: 2026-11-19
  pdf:
    url: https://rbidocs.rbi.org.in/rdocs/notification/PDFs/CIRCULAR677EC931A7A65E4D99AA957D8E85BC0A2A.PDF
    fetched_on: 2026-11-19
    sha256: 666fe280ed11486cea4e36f905318e75322ed9343a6b188008d0936f800f88f6
  amended_by:
    - rbi.dpss_1897_2020
    - rbi.dpss_s106_2021
  notes: >-
    Para 7: effective 15 Oct 2019. Annex General Instruction 4: "T is the day of transaction and refers to the calendar date."
    General Instruction 5: R is the day the reversal is concluded and funds are received by the issuer/originator;
    reversal to the customer the same day. General Instruction 7: domestic transactions only. Para 5: compensation suo moto.
    The hosted PDF para 6 cites RB-IOS 2021 (as amended), so RBI has edited the PDF in place since 2019.
    Still referenced "as amended from time to time" by RBI directions issued in 2024-2025. Not seen in the Nov 2025
    DoR repeal list (that consolidation covered Department of Regulation circulars; this is a DPSS circular) - user to confirm.

tat_rules:
  - id: rbi.tat.atm_cash_not_dispensed
    clause: Annex Sl. 1(a)
    payment_system: ATM (incl. Micro-ATM)
    scenario: Customer's account debited but cash not dispensed
    responsible: issuer_bank
    deadline_days: 5
    compensation: {per_day_inr: 100, beyond_days: 5, payee_text: to the credit of the account holder}
    finding_policy: late_reversal_claim
    quote: "Pro-active reversal (R) of failed transaction within a maximum of T + 5 days. | ₹ 100/- per day of delay beyond T + 5 days, to the credit of the account holder."
    effective_from: 2019-10-15

  - id: rbi.tat.card_to_card
    clause: Annex Sl. 2(a)
    payment_system: Card
    scenario: Card to card transfer - card account debited but beneficiary card account not credited
    responsible: not_stated
    deadline_days: 1
    compensation: {per_day_inr: 100, beyond_days: 1}
    finding_policy: late_reversal_claim
    quote: "Transaction to be reversed (R) latest within T + 1 day, if credit is not effected to the beneficiary account. | ₹ 100/- per day of delay beyond T + 1 day."
    effective_from: 2019-10-15

  - id: rbi.tat.card_pos
    clause: Annex Sl. 2(b)
    payment_system: Card - PoS (card present) incl. cash at PoS
    scenario: Account debited but confirmation not received at merchant location, i.e. charge-slip not generated
    responsible: not_stated
    deadline_days: 5
    compensation: {per_day_inr: 100, beyond_days: 5}
    finding_policy: late_reversal_claim
    quote: "Auto-reversal within T + 5 days. | ₹ 100/- per day of delay beyond T + 5 days."
    effective_from: 2019-10-15

  - id: rbi.tat.card_cnp
    clause: Annex Sl. 2(c)
    payment_system: Card - Card Not Present (e-commerce)
    scenario: Account debited but confirmation not received at merchant's system
    responsible: not_stated
    deadline_days: 5
    compensation: {per_day_inr: 100, beyond_days: 5}
    finding_policy: late_reversal_claim
    merged_cell: true
    quote: "Auto-reversal within T + 5 days. | ₹ 100/- per day of delay beyond T + 5 days. (cells merged with row 2(b) in the PDF table)"
    effective_from: 2019-10-15

  - id: rbi.tat.imps_not_credited
    clause: Annex Sl. 3(a)
    payment_system: IMPS
    scenario: Account debited but the beneficiary account is not credited
    responsible: beneficiary_bank
    deadline_days: 1
    compensation: {per_day_inr: 100, beyond_days: 1}
    finding_policy: needs_user_input
    quote: "If unable to credit to beneficiary account, auto reversal (R) by the Beneficiary bank latest on T + 1 day. | ₹100/- per day if delay is beyond T + 1 day."
    effective_from: 2019-10-15

  - id: rbi.tat.upi_p2p_not_credited
    clause: Annex Sl. 4(a)
    payment_system: UPI
    scenario: Account debited but the beneficiary account is not credited (transfer of funds)
    responsible: beneficiary_bank
    deadline_days: 1
    compensation: {per_day_inr: 100, beyond_days: 1}
    finding_policy: needs_user_input
    quote: "If unable to credit the beneficiary account, auto reversal (R) by the Beneficiary bank latest on T + 1 day. | ₹100/- per day if delay is beyond T + 1 day."
    effective_from: 2019-10-15

  - id: rbi.tat.upi_merchant
    clause: Annex Sl. 4(b)
    payment_system: UPI
    scenario: Account debited but transaction confirmation not received at merchant location (payment to merchant)
    responsible: not_stated
    deadline_days: 5
    compensation: {per_day_inr: 100, beyond_days: 5}
    finding_policy: late_reversal_claim
    quote: "Auto-reversal within T + 5 days. | ₹100/- per day if delay is beyond T + 5 days."
    effective_from: 2019-10-15

  - id: rbi.tat.aeps_merchant
    clause: Annex Sl. 5(a)
    payment_system: AePS (incl. Aadhaar Pay)
    scenario: Account debited but transaction confirmation not received at merchant location
    responsible: acquirer
    deadline_days: 5
    compensation: {per_day_inr: 100, beyond_days: 5}
    finding_policy: late_reversal_claim
    quote: "Acquirer to initiate \"Credit Adjustment\" within T + 5 days. | ₹100/- per day if delay is beyond T + 5 days."
    effective_from: 2019-10-15

  - id: rbi.tat.aeps_not_credited
    clause: Annex Sl. 5(b)
    payment_system: AePS (incl. Aadhaar Pay)
    scenario: Account debited but beneficiary account not credited
    responsible: acquirer
    deadline_days: 5
    compensation: {per_day_inr: 100, beyond_days: 5}
    finding_policy: needs_user_input
    merged_cell: true
    quote: "Acquirer to initiate \"Credit Adjustment\" within T + 5 days. | ₹100/- per day if delay is beyond T + 5 days. (cells merged with row 5(a) in the PDF table)"
    effective_from: 2019-10-15

  - id: rbi.tat.apbs_credit_delay
    clause: Annex Sl. 6(a)
    payment_system: APBS
    scenario: Delay in crediting beneficiary's account
    responsible: beneficiary_bank
    deadline_days: 1
    compensation: {per_day_inr: 100, beyond_days: 1}
    finding_policy: not_detectable_v1
    quote: "Beneficiary bank to reverse the transaction within T + 1 day. | ₹100/- per day if delay is beyond T + 1 day."
    effective_from: 2019-10-15

  - id: rbi.tat.nach_credit_delay
    clause: Annex Sl. 7(a)
    payment_system: NACH
    scenario: Delay in crediting beneficiary's account or reversal of amount
    responsible: beneficiary_bank
    deadline_days: 1
    compensation: {per_day_inr: 100, beyond_days: 1}
    finding_policy: not_detectable_v1
    quote: "Beneficiary bank to reverse the uncredited transaction within T + 1 day. | ₹100/- per day if delay is beyond T + 1 day."
    effective_from: 2019-10-15

  - id: rbi.tat.nach_debit_after_revocation
    clause: Annex Sl. 7(b)
    payment_system: NACH
    scenario: Account debited despite revocation of debit mandate with the bank by the customer
    responsible: customer_bank
    deadline_days: 1
    compensation: {per_day_inr: 100, beyond_days: 1}
    finding_policy: needs_user_input
    user_inputs:
      - mandate_revocation_date
      - revocation_proof_confirmed
    letter_disclosure: The mandate revocation date stated here was provided by the customer and is not shown on the bank statement.
    merged_cell: true
    quote: "Customer's bank will be responsible for such debit. Resolution to be completed within T + 1 day. | ₹100/- per day if delay is beyond T + 1 day. (compensation cell merged with row 7(a) in the PDF table)"
    effective_from: 2019-10-15

  - id: rbi.tat.ppi_off_us
    clause: Annex Sl. 8(a)
    payment_system: PPI (cards / wallets)
    scenario: Off-us transaction riding on UPI, card network, IMPS etc.
    responsible: underlying_system
    compensation: null
    finding_policy: delegates
    delegates_to:
      - rbi.tat.upi_p2p_not_credited
      - rbi.tat.upi_merchant
      - rbi.tat.card_to_card
      - rbi.tat.card_pos
      - rbi.tat.card_cnp
      - rbi.tat.imps_not_credited
    quote: "The transaction will ride on UPI, card network, IMPS, etc., as the case may be. The TAT and compensation rule of respective system shall apply."
    effective_from: 2019-10-15

  - id: rbi.tat.ppi_on_us
    clause: Annex Sl. 8(b)
    payment_system: PPI (cards / wallets)
    scenario: On-us - beneficiary's PPI not credited, or PPI debited but confirmation not received at merchant location
    responsible: not_stated
    deadline_days: 1
    compensation: {per_day_inr: 100, beyond_days: 1}
    finding_policy: not_detectable_v1
    quote: "Reversal effected in Remitter's account within T + 1 day. | ₹100/- per day if delay is beyond T + 1 day."
    effective_from: 2019-10-15
