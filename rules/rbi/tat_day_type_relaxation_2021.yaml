    clause: Annexure SN 2
    applies_to: rbi.dpss_629_2019
    day_type: working
    effective_from: 2021-05-21
    effective_to: 2021-09-30
    quote: "Working days until December 31, 2020 (Calendar days from January 1, 2021) | Working days - Prospective - Until September 30, 2021"
    ambiguity: >-
      "Prospective" has no explicit start date; the circular date (21 May 2021) is assumed.
      Transactions dated 1 Jan 2021 - 20 May 2021 are treated as calendar days but marked needs_review.
