instrument:
  id: rbi.rbios_2026
  issuer: RBI
  title: Reserve Bank - Integrated Ombudsman Scheme, 2026
  ref_no: Press Release 2025-2026/1936, 16 Jan 2026
  dept_ref: null
  issued_on: 2026-01-16
  effective_from: 2026-07-01
  effective_to: null
  legal_status: in_force
  page:
    url: https://www.rbi.org.in/Scripts/BS_PressReleaseDisplay.aspx?prid=62052
    fetched_on: 2026-11-19
  pdf:
    url: https://rbidocs.rbi.org.in/rdocs/content/pdfs/SCHEME16012026_A.pdf
    fetched_on: 2026-11-19
    sha256: f119574982a073819d2286c3d016ef10e1fbeebed8e23864e40e885d950901b6
  notes: >-
    Replaces RB-IOS 2021 for complaints received on or after 1 Jul 2026. Clause 10 and 11 rules were checked by the
    user against the scheme PDF, downloaded manually. Appeal and transition clauses are not encoded (not used in v1,
    see docs/rules_verification.md section D).

ombudsman_rules:
  - id: rbi.rbios26.direct_to_ombudsman
    clause: Clause 10(1)(a)
    kind: direct_to_ombudsman
    text: The complaint must be addressed to the RBI Ombudsman directly; copying RBI on a letter to the bank is not a complaint under the Scheme.
    quote: "the complaint is addressed to the RBI Ombudsman directly. However, it does not include a communication in which the Reserve Bank is merely endorsed/marked in copy (whether by e-mail or in physical form)"
    source: {url: "https://rbidocs.rbi.org.in/rdocs/content/pdfs/SCHEME16012026_A.pdf", fetched_on: 2026-11-19}
    effective_from: 2026-07-01
    review: {status: verified, verified_by: Hardik Agarwal, verified_on: 2026-11-19}

  - id: rbi.rbios26.who_may_file
    clause: Clause 10(1)(b)
    kind: who_may_file
    text: The complainant files personally or through an authorised representative who is not an advocate (unless the advocate is the aggrieved person).
    quote: "the complaint is lodged by the Complainant personally or through an authorised representative other than an advocate unless the advocate is the aggrieved person"
    source: {url: "https://rbidocs.rbi.org.in/rdocs/content/pdfs/SCHEME16012026_A.pdf", fetched_on: 2026-11-19}
    effective_from: 2026-07-01
    review: {status: verified, verified_by: Hardik Agarwal, verified_on: 2026-11-19}

  - id: rbi.rbios26.prior_complaint
    clause: Clause 10(1)(e)
    kind: prior_complaint_required
    text: The customer must first complain to the regulated entity (the bank), in writing or any mode with producible proof.
    quote: "the Complainant had first made a complaint in writing or through any other mode to the Regulated Entity concerned, where proof of having made a complaint can be produced by the Complainant, before making a complaint under the Scheme"
    source: {url: "https://rbidocs.rbi.org.in/rdocs/content/pdfs/SCHEME16012026_A.pdf", fetched_on: 2026-11-19}
    effective_from: 2026-07-01
    review: {status: verified, verified_by: Hardik Agarwal, verified_on: 2026-11-19}

  - id: rbi.rbios26.wait
    clause: Clause 10(1)(f)
    kind: wait_before_escalation
    days: 30
    longer_system_wait_applies: true
    anchor: date the Regulated Entity received the complaint
    text: >-
      Escalate if no reply within 30 days (or a longer period set by RBI, NPCI or card network guidelines, whichever
      is higher), or earlier if the reply or resolution is unsatisfactory. Effective wait =
      max(30, escalation_wait_days of the TAT rule); escalation_wait_days stays null until a longer period is
      found on an allowed source and verified.
    quote: "the Complainant has not received any reply within 30 days or within the time specified by the Reserve Bank, National Payments Corporation of India, or under Card Network guidelines, if any, whichever is higher after the Regulated Entity received the complaint; or the Complainant is not satisfied with the reply / resolution provided by the Regulated Entity"
    source: {url: "https://rbidocs.rbi.org.in/rdocs/content/pdfs/SCHEME16012026_A.pdf", fetched_on: 2026-11-19}
    effective_from: 2026-07-01
    review: {status: verified, verified_by: Hardik Agarwal, verified_on: 2026-11-19}

  - id: rbi.rbios26.deadline
    clause: Clause 10(1)(g)
    kind: escalation_deadline
    days: 90
    anchor: later of (expiry of the Clause 10(1)(f) timeline) and (date of the last communication from the Regulated Entity)
    text: The complaint to the RBI Ombudsman must be filed within 90 days of the later anchor.
    quote: "the complaint is made to the RBI Ombudsman within 90 days from the date on which the timeline specified in sub-clause (1)(f) expires or the date of the last communication from the concerned Regulated Entity, whichever is later"
    source: {url: "https://rbidocs.rbi.org.in/rdocs/content/pdfs/SCHEME16012026_A.pdf", fetched_on: 2026-11-19}
    effective_from: 2026-07-01
    review: {status: verified, verified_by: Hardik Agarwal, verified_on: 2026-11-19}

  - id: rbi.rbios26.no_duplicate_grievance
    clause: Clause 10(1)(h)-(k)
    kind: no_duplicate_grievance
    text: >-
      Not maintainable if the same grievance is pending before, or settled or dealt with on merits by, the RBI
      Ombudsman or any court, tribunal, arbitrator or other judicial or quasi-judicial forum. Explanation 1 excludes
      criminal proceedings and police investigations from "same grievance" for (j) and (k).
    quote: "the complaint is not relating to the same grievance, which is already pending before the Office of the RBI Ombudsman, whether or not received from the same Complainant or along with one or more Complainants; or (i) the complaint is not relating to the same grievance, which is already settled or dealt with on merits, by the Office of the RBI Ombudsman, whether or not received from the same Complainant or along with one or more Complainants; and (j) the complaint is not relating to the same grievance, which is already pending before any Court, Tribunal or Arbitrator or any other judicial or quasi-judicial forum, whether or not received from the same Complainant or along with one or more of the Complainants; or (k) the complaint is not relating to the same grievance, which is already settled or dealt with on merits, by any Court, Tribunal or Arbitrator or any other judicial or quasi-judicial forum, whether or not received from the same Complainant or along with one or more of the Complainants"
    source: {url: "https://rbidocs.rbi.org.in/rdocs/content/pdfs/SCHEME16012026_A.pdf", fetched_on: 2026-11-19}
    effective_from: 2026-07-01
    review: {status: verified, verified_by: Hardik Agarwal, verified_on: 2026-11-19}

  - id: rbi.rbios26.limitation
    clause: Clause 10(1)(l)
    kind: limitation
    text: >-
      The complaint to the bank must have been made within the limitation period of the Limitation Act, 1963.
      VAPAS stores no number for this period because no allowed source states it.
    quote: "the complaint to the Regulated Entity was made before the expiry of the period of limitation prescribed under the Limitation Act, 1963, for such claims"
    source: {url: "https://rbidocs.rbi.org.in/rdocs/content/pdfs/SCHEME16012026_A.pdf", fetched_on: 2026-11-19}
    effective_from: 2026-07-01
    review: {status: verified, verified_by: Hardik Agarwal, verified_on: 2026-11-19}

  - id: rbi.rbios26.non_maintainable_rejected
    clause: Clause 10(3)
    kind: non_maintainable_rejected
    text: A complaint failing any 10(1) condition, or excluded under 10(2), is rejected at the outset without examination.
    quote: "Complaints not meeting the eligibility conditions as specified under sub-clause (1) and complaints that are mentioned in sub-clause (2), shall be rejected at the outset as non-maintainable without further examination, with appropriate communication to the Complainant."
    source: {url: "https://rbidocs.rbi.org.in/rdocs/content/pdfs/SCHEME16012026_A.pdf", fetched_on: 2026-11-19}
    effective_from: 2026-07-01
    review: {status: verified, verified_by: Hardik Agarwal, verified_on: 2026-11-19}

  - id: rbi.rbios26.filing_channels
    clause: Clause 11(1) and 11(2)
    kind: filing_channel
    text: >-
      Online through https://cms.rbi.org.in, or by e-mail or physical mode to the Centralised Receipt and Processing
      Centre as notified by RBI; physical complaints must be signed. Contact details as notified (RBI FAQ Q9):
      crpc@rbi.org.in; CRPC, Reserve Bank of India, Central Vista, Sector 17, Chandigarh - 160017.
    quote: "The complaint may be lodged online through the portal https://cms.rbi.org.in. (2) The complaint may also be submitted through e-mail or physical mode to the Centralised Receipt and Processing Centre as notified by the Reserve Bank. The complaint, if submitted in physical form, shall be duly signed by the Complainant or by the authorised representative. The complaint submitted in electronic or physical mode shall be in such format as specified in Annex."
    source: {url: "https://rbidocs.rbi.org.in/rdocs/content/pdfs/SCHEME16012026_A.pdf", fetched_on: 2026-11-19}
    effective_from: 2026-07-01
    review: {status: verified, verified_by: Hardik Agarwal, verified_on: 2026-11-19}
