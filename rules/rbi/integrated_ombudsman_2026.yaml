instrument:
  id: rbi.rbios_2026
  issuer: RBI
  title: Reserve Bank - Integrated Ombudsman Scheme, 2026
  ref_no: null
  dept_ref: null
  issued_on: 2026-01-16
  effective_from: 2026-07-01
  effective_to: null
  legal_status: in_force
  page:
    url: https://www.rbi.org.in/Scripts/BS_PressReleaseDisplay.aspx?prid=62052
    fetched_on: 2026-11-19
  pdf:
    url: https://rbidocs.rbi.org.in/rdocs/content/pdfs/SCHEME16012026_A.pdf
    fetched_on: 2026-11-19
  notes: >-
    Press release 2025-2026/1936. Replaces RB-IOS 2021 for complaints received on or after 1 Jul 2026.
    The scheme PDF sits behind a CAPTCHA and could not be read automatically, so clause text below comes from
    RBI's own FAQ on the scheme (rbi.org.in). The user must check each rule against the scheme PDF and record the
    exact clause number and the notification number (not shown on the press release).

ombudsman_rules:
  - id: rbi.rbios26.prior_complaint
    clause: Clause 10 (via FAQ Q16/Q17) - exact sub-clause to confirm
    kind: prior_complaint_required
    text: The customer must first complain to the regulated entity (the bank) and keep proof of that complaint.
    quote: "The complainant must first approach the concerned Regulated Entity."
    source: {url: "https://www.rbi.org.in/commonperson/english/scripts/FAQs.aspx?Id=3407", fetched_on: 2026-11-19}
    effective_from: 2026-07-01

  - id: rbi.rbios26.wait
    clause: Clause 10 (via FAQ Q17) - exact sub-clause to confirm
    kind: wait_before_escalation
    days: 30
    longer_system_wait_applies: true
    anchor: date the regulated entity received the complaint
    text: >-
      Escalate if no reply within 30 days (or a longer period set by RBI, NPCI or card network guidelines, whichever
      is higher), or earlier if the bank replied and the customer is not satisfied. Effective wait =
      max(30, escalation_wait_days of the TAT rule); escalation_wait_days stays null until a longer period is
      found on an allowed source and verified.
    quote: "if the complainant has not received any reply within 30 days or within the time specified by RBI, NPCI or Card Network guidelines, if any, whichever is higher"
    source: {url: "https://www.rbi.org.in/commonperson/english/scripts/FAQs.aspx?Id=3407", fetched_on: 2026-11-19}
    effective_from: 2026-07-01

  - id: rbi.rbios26.deadline
    clause: Clause 10 (via FAQ Q17) - exact sub-clause to confirm
    kind: escalation_deadline
    days: 90
    anchor: later of (expiry of the wait period) and (date of the last communication from the regulated entity)
    text: The complaint to the RBI Ombudsman must be filed within 90 days of the later anchor.
    quote: "within 90 days from the date on which the above timeline expires or the date of the last communication from the concerned Regulated Entity, whichever is later"
    source: {url: "https://www.rbi.org.in/commonperson/english/scripts/FAQs.aspx?Id=3407", fetched_on: 2026-11-19}
    effective_from: 2026-07-01

  - id: rbi.rbios26.limitation
    clause: Clause 10 (via FAQ Q16/Q17) - exact sub-clause to confirm
    kind: limitation
    text: >-
      The complaint to the bank must have been made within the limitation period of the Limitation Act, 1963.
      VAPAS stores no number for this period because no allowed source states it.
    quote: "the complaint to the Regulated Entity must have been made before expiry of the period of limitation prescribed under the Limitation Act, 1963"
    source: {url: "https://www.rbi.org.in/commonperson/english/scripts/FAQs.aspx?Id=3407", fetched_on: 2026-11-19}
    effective_from: 2026-07-01

  - id: rbi.rbios26.filing_channels
    clause: FAQ Q9 - scheme clause to confirm
    kind: filing_channel
    text: "Online at https://cms.rbi.org.in; e-mail crpc@rbi.org.in; post to CRPC, Reserve Bank of India, Central Vista, Sector 17, Chandigarh - 160017."
    quote: "Online: through the CMS portal at https://cms.rbi.org.in. E-mail: by sending the complaint to crpc@rbi.org.in."
    source: {url: "https://www.rbi.org.in/commonperson/english/scripts/FAQs.aspx?Id=3407", fetched_on: 2026-11-19}
    effective_from: 2026-07-01

  - id: rbi.rbios26.appeal
    clause: FAQ Q31/Q32 - scheme clause to confirm
    kind: appeal_deadline
    days: 30
    anchor: date of receipt of the Award
    text: The complainant may appeal an Award within 30 days; the Appellate Authority may allow up to 30 more days for sufficient reason.
    quote: "A complainant may file an appeal within 30 days from the date of receiving the Award."
    source: {url: "https://www.rbi.org.in/commonperson/english/scripts/FAQs.aspx?Id=3407", fetched_on: 2026-11-19}
    effective_from: 2026-07-01

  - id: rbi.rbios26.transition
    clause: FAQ Q1 - scheme clause to confirm
    kind: transition
    text: Complaints received before 1 Jul 2026, appeals from RB-IOS 2021 decisions and execution of RB-IOS 2021 awards stay under RB-IOS 2021.
    quote: "Complaints received before July 1, 2026; appeals arising from decisions under RB-IOS, 2021; and execution of awards issued thereunder will continue to be governed by RB-IOS, 2021"
    source:
      url: https://www.rbi.org.in/commonman/Upload/English/FAQs/PDFs/RBIOS01072026.pdf
      fetched_on: 2026-11-19
      sha256: db923b0fe96466e98510a151404c3022b5d8e3a48b51e304c142e354ba0dca66
    effective_from: 2026-07-01
