app = "vapas-api"
primary_region = "bom"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "backend/Dockerfile"

[deploy]
  release_command = "sh -c 'alembic upgrade head && python scripts/ingest_rbi.py --rules'"
  strategy = "rolling"

[env]
  APP_ENV = "production"
  LOG_LEVEL = "INFO"
  CLIENT_IP_HEADER = "X-Vapas-Client-IP"
  REFRESH_COOKIE_PATH = "/api/auth"
  S3_REGION = "auto"
  S3_BUCKET_RAW = "vapas-raw"
  CLAIM_LOOKBACK_MONTHS = "12"
  ACCESS_TOKEN_MINUTES = "15"
  REFRESH_TOKEN_DAYS = "30"
  WORKER_HEARTBEAT_SECONDS = "30"
  LLM_DAILY_CALL_BUDGET = "6"
  PRIVATE_FIXTURES_DIR = ""
  MAIL_OUTBOX_DIR = ""
  INVITE_ONLY = "true"
  LLM_FALLBACK_ENABLED = "false"
  LETTER_POLISH_ENABLED = "false"
  OLLAMA_URL = ""
  MAIL_BACKEND = "smtp"

[processes]
  api = "uvicorn --factory vapas.main:create_app --host 0.0.0.0 --port 8000 --no-server-header --timeout-graceful-shutdown 25"
  worker = "sh -c 'DATABASE_URL=\"$WORKER_DATABASE_URL\" exec python -m vapas.jobs.worker'"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["api"]

  [http_service.concurrency]
    type = "requests"
    soft_limit = 40
    hard_limit = 80

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    method = "GET"
    path = "/ready"
    timeout = "3s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["api"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
  processes = ["worker"]
